services:
  postgres:
    image: postgres:16-alpine
    container_name: campfire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campfire
      POSTGRES_USER: campfire
      POSTGRES_PASSWORD: campfire
    ports:
      - "5433:5432"
    volumes:
      - campfire-postgres-data:/var/lib/postgresql/data

volumes:
  campfire-postgres-data:
