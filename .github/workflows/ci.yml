name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Campfire.sln

      - name: Build
        run: dotnet build Campfire.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Campfire.Api.Tests/Campfire.Api.Tests.csproj --no-build --configuration Release --verbosity normal

  client:
    name: Build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Campfire.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/Campfire.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
